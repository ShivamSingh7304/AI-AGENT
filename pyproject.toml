[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.115.0",
    "fonttools>=4.67.0",
    "gradio-client>=2.7.2",
    "langchain[mcp]>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.11",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.15",
    "httpx>=0.27.0",
    "python-multipart>=0.0.18",
    "pypdf>=6.20.1",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.0",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.50.0",
    "tavily>=1.1.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
ai-agent = "ai_agent:main"
ai-agent-file-mcp = "ai_agent.tools.file_read_write.file:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
