[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.11",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.15",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
